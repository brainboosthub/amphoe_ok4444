<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="รวบรวมสื่อและนวัตกรรมการเรียนรู้">
  <title>สื่อ/นวัตกรรม | Innovative Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="innovation.css?v=20260818-1">
</head>
<body>
  <main class="innovation-page">
    <div class="innovation-container">
      <div class="innovation-topbar">
        <a class="innovation-back" href="index.html" aria-label="กลับหน้าหลัก" onclick="return backToHome(event)">← กลับหน้าหลัก</a>
      </div>

      <header class="innovation-heading">
        <h1>สื่อ/นวัตกรรม</h1>
        <span aria-hidden="true"></span>
        <p>Innovative Media</p>
      </header>

      <div class="innovation-tools">
        <label for="innovationTypeFilter">ประเภทสื่อ</label>
        <select id="innovationTypeFilter" disabled>
          <option value="">ทั้งหมด</option>
        </select>
      </div>

      <div id="innovationStatus" class="innovation-status" role="status">
        <span class="innovation-spinner" aria-hidden="true"></span>
        <span>กำลังโหลดรายการ...</span>
      </div>

      <section id="innovationGrid" class="innovation-grid" aria-live="polite"></section>
    </div>
  </main>
  <script src="innovation.js?v=20260818-1"></script>
  <script>
function backToHome(event) {
  event.preventDefault();

  // เปิด user_all.html เป็นแท็บใหม่
  if (window.opener && !window.opener.closed) {
    window.close();
    return false;
  }

  // เปิดในแท็บเดียวกัน
  if (window.history.length > 1) {
    window.history.back();
    return false;
  }

  // เปิด user_all.html โดยตรง
  window.location.href = 'index.html';
  return false;
}
</script>
</body>
</html>
