<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>กิจกรรมทั้งหมด</title>

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- CSS หลักของเว็บไซต์ -->
  <link rel="stylesheet" href="style.css">

  <!-- CSS Activity Box -->
  <link rel="stylesheet" href="activity-box.css">

  <style>
    .activity-page{
      min-height:100vh;
      padding:48px 0 80px;
      background:#f5f7fb;
    }

    .activity-page-container{
      width:min(1320px, calc(100% - 40px));
      margin:0 auto;
    }

    .activity-page-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-bottom:28px;
    }

    .activity-page-heading{
      min-width:0;
    }

    .activity-page-kicker{
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin-bottom:8px;
      color:#ef7c00;
      font-size:14px;
      font-weight:700;
    }

    .activity-page-heading h1{
      margin:0;
      color:#111827;
      font-size:clamp(28px, 4vw, 42px);
      line-height:1.2;
    }

    .activity-page-heading p{
      margin:10px 0 0;
      color:#64748b;
      font-size:16px;
    }

    .activity-back-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      flex-shrink:0;

      padding:11px 18px;
      border-radius:999px;

      background:#fff;
      border:1px solid #dbe1ea;
      color:#334155;

      text-decoration:none;
      font-size:15px;
      font-weight:700;

      box-shadow:0 5px 15px rgba(15,23,42,.07);
      transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;
    }

    .activity-back-btn:hover{
      transform:translateY(-2px);
      border-color:#ff9800;
      box-shadow:0 10px 22px rgba(15,23,42,.12);
    }

    .activity-page .activity-box-grid{
      grid-template-columns:repeat(6, minmax(0, 1fr));
    }

    .activity-page-status{
      padding:45px 20px;
      border:1px dashed #cbd5e1;
      border-radius:16px;
      background:#fff;
      color:#64748b;
      text-align:center;
      font-size:16px;
    }

    @media (max-width:1200px){
      .activity-page .activity-box-grid{
        grid-template-columns:repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width:992px){
      .activity-page .activity-box-grid{
        grid-template-columns:repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width:768px){
      .activity-page{
        padding:34px 0 60px;
      }

      .activity-page-container{
        width:min(100% - 28px, 1320px);
      }

      .activity-page-top{
        align-items:flex-start;
      }

      .activity-page .activity-box-grid{
        grid-template-columns:repeat(2, minmax(0, 1fr));
        gap:16px;
      }
    }

    @media (max-width:520px){
      .activity-page-top{
        flex-direction:column;
      }

      .activity-back-btn{
        width:100%;
      }

      .activity-page .activity-box-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

  <!-- ใส่ Header หรือ Menu เดิมของเว็บไซต์ตรงนี้ -->

  <main class="activity-page">
    <div class="activity-page-container">

      <div class="activity-page-top">

        <div class="activity-page-heading">
          <div class="activity-page-kicker">
            <i class="fa-solid fa-star"
               aria-hidden="true"></i>
            ข่าวกิจกรรม
          </div>

          <h1>กิจกรรมทั้งหมด</h1>

          <p>
            รวมข่าวสารและกิจกรรมทั้งหมด
          </p>
        </div>

<a class="activity-back-btn"
   href="index.html"
   onclick="return backToHome(event)">
          <i class="fa-solid fa-arrow-left"
             aria-hidden="true"></i>
          กลับหน้าหลัก
        </a>

      </div>

      <div id="activityAllStatus"
           class="activity-page-status">
        กำลังโหลดข้อมูลกิจกรรม...
      </div>

      <div id="activityAllGrid"
           class="activity-box-grid">
      </div>

    </div>
  </main>

  <!-- ใส่ Footer เดิมของเว็บไซต์ตรงนี้ -->

  <script>
    (() => {
      'use strict';

      const ACTIVITY_API_URL =
        'https://script.google.com/macros/s/AKfycbxvqWwNRKu5GpoVRyDZGdwXRy6ubEgPAg2-stv-G-arF4HRoqkAfP21oTl124ne6CvZ/exec?mode=activity';

      const escapeHtml = (value) => String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

      function normalizeActivity(row) {
        return {
          title: String(
            row.title ??
            row.topic ??
            ''
          ).trim(),

          image: String(
            row.image ??
            row.imageUrl ??
            ''
          ).trim(),

          url: String(
            row.url ??
            row.link ??
            ''
          ).trim(),

          date: String(
            row.date ??
            ''
          ).trim()
        };
      }

      function renderActivities(items) {
        const grid =
          document.getElementById('activityAllGrid');

        const status =
          document.getElementById('activityAllStatus');

        if (!grid || !status) return;

        if (!items.length) {
          grid.innerHTML = '';
          status.hidden = false;
          status.textContent = 'ยังไม่มีข้อมูลกิจกรรม';
          return;
        }

        status.hidden = true;

        grid.innerHTML = items.map((item) => {
          const title = escapeHtml(
            item.title || 'กิจกรรม'
          );

          const image = escapeHtml(
            item.image ||
            'https://placehold.co/900x650?text=Activity'
          );

          const url = escapeHtml(item.url || '');
          const date = escapeHtml(item.date || '');

          const clickableClass =
            item.url ? ' is-clickable' : '';

          return `
            <article class="activity-box-card${clickableClass}">

              <a class="activity-box-image-link"
                 href="${url || '#'}"
                 ${item.url
                   ? 'target="_blank" rel="noopener noreferrer"'
                   : 'aria-disabled="true" tabindex="-1"'}
                 aria-label="เปิดรายละเอียด ${title}">

                <img
                  src="${image}"
                  alt="${title}"
                  loading="lazy"
                  onerror="this.onerror=null;this.src='https://placehold.co/900x650?text=Activity';">
              </a>

              <div class="activity-box-card-body">

                <h3>${title}</h3>

                ${
                  date
                    ? `
                      <div class="activity-box-date">
                        <i class="fa-solid fa-calendar-days"
                           aria-hidden="true"></i>
                        <span>${date}</span>
                      </div>
                    `
                    : ''
                }

              </div>
            </article>
          `;
        }).join('');
      }

      async function loadAllActivities() {
        const status =
          document.getElementById('activityAllStatus');

        try {
          const response = await fetch(
            ACTIVITY_API_URL + '&_t=' + Date.now(),
            {
              method:'GET',
              cache:'no-store'
            }
          );

          if (!response.ok) {
            throw new Error(
              `HTTP ${response.status}`
            );
          }

          const result = await response.json();

          if (!result.success) {
            throw new Error(
              result.message ||
              'โหลดข้อมูลกิจกรรมไม่สำเร็จ'
            );
          }

          const items = (result.activities || [])
            .map(normalizeActivity)
            .filter(item =>
              item.title || item.image
            );

          renderActivities(items);

        } catch (error) {
          console.error(
            'Activity All Page:',
            error
          );

          if (status) {
            status.hidden = false;
            status.textContent =
              'ไม่สามารถโหลดข้อมูลกิจกรรมได้ กรุณาตรวจสอบ Apps Script';
          }
        }
      }

      document.addEventListener(
        'DOMContentLoaded',
        loadAllActivities
      );
    })();
  </script>
<script>
function backToHome(event) {
  event.preventDefault();

  // หาก activity.html เปิดเป็นแท็บใหม่ ให้ปิดแท็บ
  // หน้า index.html เดิมจะยังแสดงข้อมูลและตำแหน่งเดิม
  if (window.opener && !window.opener.closed) {
    window.close();
    return false;
  }

  // หากเปิดในแท็บเดียวกัน ให้ย้อนกลับไปหน้าเดิม
  if (window.history.length > 1) {
    window.history.back();
    return false;
  }

  // กรณีเปิด activity.html โดยตรงและไม่มีประวัติ
  window.location.href = 'index.html';
  return false;
}
</script>
</body>
</html>
